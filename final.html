<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>属于我们的四百天</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, PingFang SC, "微软雅黑", sans-serif;
}
body{
    background-color: #c7e4ff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}
.cloud{
    position: absolute;
    background: #ffffff;
    border-radius: 999px;
    animation: cloudRun 30s linear infinite;
}
@keyframes cloudRun{
    0%{transform: translateX(-200px);}
    100%{transform: translateX(105vw);}
}
.heart{
    position: absolute;
    font-size: 26px;
    color: #ff5e8c;
    pointer-events: none;
    animation: heartUp 1s ease-out forwards;
}
@keyframes heartUp{
    0%{opacity: 1; transform: translateY(0);}
    100%{opacity: 0; transform: translateY(-200px);}
}
.pop{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
    display: none;
    z-index: 999;
    align-items: center;
    justify-content: center;
}
.pop-box{
    width: 82%;
    max-width: 330px;
    background: #fff;
    padding: 32px 20px;
    border-radius: 20px;
    text-align: center;
}
.pop-text{
    font-size: 17px;
    color: #114477;
    margin-bottom: 22px;
    line-height: 1.7;
}
.pop-btn{
    background: #69b6ff;
    border: none;
    color: white;
    padding: 9px 26px;
    border-radius: 30px;
    font-size: 15px;
}
.box{
    width: 90%;
    max-width: 500px;
    background: #ffffff;
    padding: 35px 20px;
    border-radius: 24px;
    margin: 0 auto;
    position: relative;
    top: 50vh;
    transform: translateY(-50%);
    text-align: center;
    z-index: 10;
}
h1{
    color: #1a5cad;
    font-size: 25px;
    margin-bottom: 20px;
}
.content{
    color: #0f3352;
    font-size: 16px;
    line-height: 2;
}
.music-button{
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 0;
    background: #69b6ff;
    color: #fff;
    font-size: 20px;
    z-index: 100;
}
</style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://music.163.com/song/media/outer/url?id=1329800014.mp3" type="audio/mpeg">
</audio>

<button class="music-button" id="audioBtn">♪</button>

<div class="pop" id="modal">
    <div class="pop-box">
        <p class="pop-text" id="words"></p>
        <button class="pop-btn" id="closePop">收下爱意</button>
    </div>
</div>

<div class="box">
    <h1>属于我们的四百天</h1>
    <div class="content">
致我全世界最可爱的老婆：
<br><br>
一晃已经携手走过四百天啦，说实话有时候真觉得自己运气爆棚，才能捡到你这么温柔又有趣的女孩子。
<br><br>
平时总爱跟你拌嘴开玩笑，偶尔故意气你看你鼓鼓腮帮子的样子，不是欺负你，是太喜欢看你所有鲜活可爱的模样。不用时刻完美，撒娇、闹小脾气、贪吃偷懒的你我全都偏爱。
<br><br>
往后还有好多个四百天，美食、晚风、琐碎日常我都想和你一起消耗，永远做你的专属出气筒、投喂工具人、随叫随到的依靠。
<br><br>
余生漫漫，只喜欢你一人。
    </div>
</div>

<script>
const sentenceList = [
    "报告老婆！今日份爱意已全额上交",
    "别的小朋友有的偏爱，你全部都有",
    "偷偷许愿：一辈子赖在你身边不跑路",
    "我的人生最优解，永远是你",
    "允许你随便凶我，我绝不还嘴",
    "四百天只是开场，余生超长续期",
    "赚钱养家归我，可爱卖萌归你",
    "全世界限定老婆，仅此一份不补货",
    "看到你，所有烦心事自动清零",
    "想和你吃无数顿饭，走无数条小路"
];

const randomSentence = sentenceList[Math.floor(Math.random() * sentenceList.length)];
document.getElementById("words").innerText = randomSentence;

const modalDom = document.getElementById("modal");
let firstClick = true;

document.body.addEventListener("touchstart", function(){
    if(firstClick){
        modalDom.style.display = "flex";
        firstClick = false;
    }
});

document.getElementById("closePop").onclick = function(){
    modalDom.style.display = "none";
};

document.body.addEventListener("click", function(e){
    let div = document.createElement("div");
    div.className = "heart";
    div.textContent = "♥";
    div.style.left = e.clientX + "px";
    div.style.top = e.clientY + "px";
    document.body.appendChild(div);
    setTimeout(function(){ div.remove(); }, 1000);
});

const audio = document.getElementById("bgMusic");
document.getElementById("audioBtn").onclick = function(){
    if(audio.paused){
        audio.play();
        this.innerText = "🔊";
    }else{
        audio.pause();
        this.innerText = "♪";
    }
};

function createCloud(){
    let cloud = document.createElement("div");
    cloud.className = "cloud";
    let width = Math.random() * 110 + 60;
    cloud.style.width = width + "px";
    cloud.style.height = (width * 0.4) + "px";
    cloud.style.top = Math.random() * 65 + "%";
    cloud.style.animationDuration = (Math.random()*25 + 20) + "s";
    document.body.appendChild(cloud);
    setTimeout(function(){ cloud.remove(); }, 45000);
}
setInterval(createCloud, 2500);
createCloud();
</script>

</body>
</html>
